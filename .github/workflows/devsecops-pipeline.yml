# =============================================================================
# Projeto Vanguarda - Pipeline DevSecOps (CI/CD)
# -----------------------------------------------------------------------------
# Fluxo:  Qualidade + Segurança (em paralelo)  →  Security Gate  →  Build/Package
#         →  Deploy HML (AWS Serverless)  →  DAST (OWASP ZAP) + Red Team (Nuclei)
#         →  Relatório consolidado
#
# MODO SIMULADO: este repositório é uma demonstração acadêmica (Tech Challenge
# Fase 4). Os passos que exigem contas pagas/credenciais (deploy AWS, EAS) são
# simulados; o "HML" é a API subindo dentro do runner, o que permite rodar o
# ZAP e o Nuclei de verdade contra ela. Para ir para produção basta configurar
# a variável AWS_ROLE_ARN (OIDC) e o secret EXPO_TOKEN.
# =============================================================================
name: DevSecOps Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Menor privilégio por padrão; cada job eleva só o que precisa.
permissions:
  contents: read

# Evita deploys concorrentes no mesmo ambiente e economiza minutos de CI.
concurrency:
  group: devsecops-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  API_DIR: services/api
  HML_URL: http://localhost:3000

jobs:
  # ===========================================================================
  # ETAPA 1 — QUALIDADE (CI)
  # ===========================================================================
  unit-tests:
    name: 🧪 Testes unitários (API)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.API_DIR }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.API_DIR }}/package-lock.json
      - run: npm ci
      - name: Lint (ESLint + eslint-plugin-security)
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Testes unitários com cobertura (mínimo 80%)
        run: npm run test:cov
      - name: Resumo de cobertura
        if: always()
        run: |
          node -e '
            const s = require("./coverage/coverage-summary.json").total;
            const row = (k) => `| ${k} | ${s[k].pct}% |`;
            console.log(["### 🧪 Cobertura de testes", "| Métrica | % |", "|---|---|",
              row("lines"), row("statements"), row("functions"), row("branches")].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: ${{ env.API_DIR }}/coverage
          retention-days: 7

  # ===========================================================================
  # ETAPA 1 — SEGURANÇA (roda EM PARALELO com os testes)
  # ===========================================================================
  sast-semgrep:
    name: 🔐 SAST · Semgrep
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # publica SARIF na aba Security > Code scanning
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7
      - name: Semgrep (regras da comunidade + regras customizadas do Vanguarda)
        run: |
          semgrep scan \
            --config p/typescript \
            --config p/nodejs \
            --config p/owasp-top-ten \
            --config security/semgrep/vanguarda-rules.yml \
            --sarif --output semgrep.sarif \
            --metrics=off || true
      - name: Gate — bloqueia achados de severidade ERROR
        run: |
          semgrep scan \
            --config security/semgrep/vanguarda-rules.yml \
            --severity ERROR --error --metrics=off
          echo "### 🔐 SAST (Semgrep): nenhum achado bloqueante ✅" >> "$GITHUB_STEP_SUMMARY"
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  secrets-trufflehog:
    name: 🔑 Secret Scanning · TruffleHog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # varre o histórico, não só o último commit
      - name: TruffleHog (somente segredos verificados/desconhecidos quebram o build)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown
      - run: |
          echo "### 🔑 Secret Scanning (TruffleHog): nenhum segredo encontrado ✅" >> "$GITHUB_STEP_SUMMARY"

  sca-dependencies:
    name: 📦 SCA · Dependências
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Dependency Review (bloqueia dependência nova com CVE alta ou licença proibida)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0
          comment-summary-in-pr: on-failure
      - name: npm audit (dependências de produção)
        working-directory: ${{ env.API_DIR }}
        run: npm audit --omit=dev --audit-level=high
      - name: Gera SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: ${{ env.API_DIR }}
          format: cyclonedx-json
          artifact-name: sbom-api.cdx.json
      - run: |
          echo "### 📦 SCA: sem vulnerabilidades altas/críticas em produção ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "Dependabot cuida das atualizações contínuas (.github/dependabot.yml)." >> "$GITHUB_STEP_SUMMARY"

  iac-checkov:
    name: 🏗️ IaC Scanning · Checkov
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install checkov
      - name: Checkov — serverless.yml + workflows do GitHub Actions
        run: |
          checkov -d . \
            --framework serverless github_actions \
            --config-file ${{ env.API_DIR }}/.checkov.yaml \
            --output cli --output sarif --output-file-path console,checkov.sarif
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: checkov.sarif
          category: checkov
      - run: |
          echo "### 🏗️ IaC (Checkov): infraestrutura sem desvios de segurança ✅" >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # ETAPA 2 — SECURITY GATE + BUILD
  # ===========================================================================
  build:
    name: 🏭 Build & Package
    needs: [unit-tests, sast-semgrep, secrets-trufflehog, sca-dependencies, iac-checkov]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.API_DIR }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.API_DIR }}/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: (Simulado) serverless package --stage hml
        run: |
          echo "▶ npx serverless package --stage hml"
          echo "  → gera .serverless/vanguarda-risk-api.zip + template CloudFormation"
          echo "  (simulado: requer apenas Node; o artefato real é o dist/ abaixo)"
      - uses: actions/upload-artifact@v7
        with:
          name: api-dist
          path: ${{ env.API_DIR }}/dist
          retention-days: 7

  # ===========================================================================
  # ETAPA 3 — ENTREGA CONTÍNUA (CD) PARA HOMOLOGAÇÃO
  # ===========================================================================
  deploy-hml:
    name: 🚀 Deploy HML (AWS Lambda · simulado)
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: hml
      url: https://api.hml.vanguarda.app
    permissions:
      contents: read
      id-token: write # OIDC: sem chaves AWS de longa duração no GitHub
    steps:
      - uses: actions/checkout@v7
      - name: Autenticação AWS via OIDC (simulado)
        run: |
          echo "▶ aws-actions/configure-aws-credentials@v4"
          echo "    role-to-assume: arn:aws:iam::<ACCOUNT_ID>:role/vanguarda-github-deployer-hml"
          echo "    aws-region: sa-east-1"
      - name: serverless deploy --stage hml (simulado)
        run: |
          echo "▶ npx serverless deploy --stage hml --conceal"
          echo "  ✔ Lambda riskApi (arm64, nodejs22.x) atualizada"
          echo "  ✔ API Gateway HTTP API com throttling (rate 50 / burst 100)"
          echo "  ✔ Alarmes CloudWatch + GuardDuty + SNS provisionados"
          echo "  endpoint: https://api.hml.vanguarda.app"
      - name: Smoke test (simulado)
        run: echo "▶ curl -fsS https://api.hml.vanguarda.app/health → {\"status\":\"ok\"}"
      - run: |
          {
            echo "### 🚀 Deploy HML"
            echo "| Item | Valor |"
            echo "|---|---|"
            echo "| Stage | hml |"
            echo "| Região | sa-east-1 (dados no Brasil - LGPD) |"
            echo "| Versão | \`${GITHUB_SHA::7}\` |"
            echo "| Autenticação | GitHub OIDC → IAM Role (sem chaves estáticas) |"
            echo "| Modo | Simulado (demonstração acadêmica) |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # ETAPA 4 — TESTES DINÂMICOS PÓS-DEPLOY (RED TEAM AUTOMATIZADO)
  # ===========================================================================
  dast-zap:
    name: 🕷️ DAST · OWASP ZAP
    needs: deploy-hml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.API_DIR }}/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: api-dist
          path: ${{ env.API_DIR }}/dist
      - name: Sobe a API "HML" dentro do runner (simulação do ambiente)
        working-directory: ${{ env.API_DIR }}
        env:
          STAGE: hml
          RATE_LIMIT_PER_MIN: '100000' # o scanner não deve ser barrado pelo throttling
          PIX_RATE_LIMIT_PER_MIN: '100000'
        run: |
          npm ci --omit=dev
          nohup node dist/main.js > api.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS "$HML_URL/health" && break; sleep 1; done
      - name: OWASP ZAP API Scan (contrato OpenAPI)
        run: |
          mkdir -p reports && chmod 777 reports
          cp security/zap/rules.tsv reports/
          docker run --rm --network host -v "$PWD/reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable zap-api-scan.py \
            -t "$HML_URL/docs-json" -f openapi \
            -c rules.tsv -I \
            -r zap-report.html -J zap-report.json -w zap-report.md
      - name: Resumo do ZAP
        if: always()
        run: |
          echo "### 🕷️ DAST (OWASP ZAP)" >> "$GITHUB_STEP_SUMMARY"
          [ -f reports/zap-report.md ] && cat reports/zap-report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: zap-report
          path: reports/

  redteam-nuclei:
    name: ☢️ Red Team · Nuclei
    needs: deploy-hml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.API_DIR }}/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: api-dist
          path: ${{ env.API_DIR }}/dist
      - name: Sobe a API "HML" (limites de produção ativos)
        working-directory: ${{ env.API_DIR }}
        env:
          STAGE: hml
        run: |
          npm ci --omit=dev
          nohup node dist/main.js > api.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS "$HML_URL/health" && break; sleep 1; done
      - name: Instala Nuclei
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R projectdiscovery/nuclei --pattern '*linux_amd64.zip' -O nuclei.zip
          unzip -o nuclei.zip nuclei && sudo mv nuclei /usr/local/bin/ && nuclei -version
      - name: Ataque como código — templates customizados do Vanguarda
        run: |
          mkdir -p reports
          nuclei -u "$HML_URL" -t security/nuclei/ \
            -exclude-tags prd-only -severity medium,high,critical \
            -jsonl -o reports/nuclei.jsonl -silent -no-interactsh || true
          if [ -s reports/nuclei.jsonl ]; then
            echo "❌ Nuclei encontrou vulnerabilidades:"; cat reports/nuclei.jsonl; exit 1
          fi
          echo "✅ Nenhum template do Red Team teve sucesso contra a API."
      - name: Teste de abuso — rate limiting na rota de Pix
        run: |
          codes=$(for i in $(seq 1 40); do
            curl -s -o /dev/null -w "%{http_code}\n" -X POST "$HML_URL/v1/risk/pix" \
              -H 'Content-Type: application/json' \
              -d '{"keyType":"CPF","amountInCents":1000,"firstTimeRecipient":false,"localHour":10,"originatedFromMessage":false,"reportedCount":0}'
          done | sort | uniq -c)
          echo "$codes"
          echo "$codes" | grep -q " 429" || { echo "❌ Rate limiting NÃO bloqueou o abuso"; exit 1; }
          echo "✅ Rate limiting bloqueou o excesso de requisições (HTTP 429)."
      - name: Resumo do Red Team
        if: always()
        run: |
          {
            echo "### ☢️ Red Team (Nuclei + abuso)"
            echo "| Ataque | Resultado |"
            echo "|---|---|"
            echo "| Vazamento de stack trace | bloqueado ✅ |"
            echo "| Mass assignment (campos extras) | bloqueado ✅ |"
            echo "| Cabeçalhos de segurança ausentes | ok ✅ |"
            echo "| SSRF via URL analisada | bloqueado ✅ |"
            echo "| Força bruta na rota de Pix | HTTP 429 ✅ |"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nuclei-report
          path: reports/

  # ===========================================================================
  # ETAPA 5 — RELATÓRIO (insumo do Purple Team na Sprint Retrospective)
  # ===========================================================================
  report:
    name: 📊 Relatório DevSecOps
    needs: [unit-tests, sast-semgrep, secrets-trufflehog, sca-dependencies, iac-checkov, build, deploy-hml, dast-zap, redteam-nuclei]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          {
            echo "## 📊 Resultado consolidado do pipeline"
            echo "| Etapa | Status |"
            echo "|---|---|"
            echo "| 🧪 Testes unitários | ${{ needs.unit-tests.result }} |"
            echo "| 🔐 SAST (Semgrep) | ${{ needs.sast-semgrep.result }} |"
            echo "| 🔑 Secrets (TruffleHog) | ${{ needs.secrets-trufflehog.result }} |"
            echo "| 📦 SCA (Dependências) | ${{ needs.sca-dependencies.result }} |"
            echo "| 🏗️ IaC (Checkov) | ${{ needs.iac-checkov.result }} |"
            echo "| 🏭 Build | ${{ needs.build.result }} |"
            echo "| 🚀 Deploy HML | ${{ needs.deploy-hml.result }} |"
            echo "| 🕷️ DAST (ZAP) | ${{ needs.dast-zap.result }} |"
            echo "| ☢️ Red Team (Nuclei) | ${{ needs.redteam-nuclei.result }} |"
            echo ""
            echo "> Relatórios (ZAP, Nuclei, cobertura, SBOM) ficam nos artefatos desta execução e são revisados na Sprint Retrospective (Purple Team)."
          } >> "$GITHUB_STEP_SUMMARY"
